<svg viewBox="0 0 1060 250" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Icon Outer bag silhouette clip -->
    <clipPath id="full-bag-contour-claro">
      <path d="M 285 260 C 375 225, 625 225, 715 260 C 765 285, 775 375, 770 540 C 765 720, 750 830, 685 940 C 600 970, 400 970, 315 940 C 250 830, 235 720, 230 540 C 225 375, 235 285, 285 260 Z" />
    </clipPath>

    <linearGradient id="silver-text-claro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="silver-facet-claro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- ICON (Shopping Bag with Dynamic Arrow) -->
  <g transform="translate(-25, 5) scale(0.25)">
    <!-- Handles (Vibrant Orange) -->
    <path d="M 390 235 C 390 35, 610 35, 610 235" fill="none" stroke="#EB4A00" stroke-width="32" stroke-linecap="round" />
    <path d="M 425 235 C 425 90, 575 90, 575 235" fill="none" stroke="#EB4A00" stroke-width="22" stroke-linecap="round" />

    <!-- Bag Body -->
    <g clip-path="url(#full-bag-contour-claro)">
      <rect x="200" y="200" width="600" height="800" fill="#EB4A00" />
      <path d="M 200 200 L 460 515 L 200 835 Z" fill="url(#silver-facet-claro)" />
      <path d="M 315 960 L 545 620 L 780 870 L 700 980 Z" fill="url(#silver-facet-claro)" />
      <path d="M 235 835 L 315 940 L 545 620 L 635 620 L 635 390 L 390 390 L 460 515 Z" fill="#FFFFFF" />
      <circle cx="390" cy="305" r="17" fill="#FFFFFF" />
      <circle cx="610" cy="305" r="17" fill="#FFFFFF" />
    </g>
  </g>

  <!-- TYPOGRAPHY (SALEAD) -->
  <g transform="translate(190, 5)">
    <!-- METALLIC SILVER LAYER (S, A, L) -->
    <g fill="url(#silver-text-claro)">
      <!-- S -->
      <path d="M 135 68 L 105 68 C 105 52, 95 44, 75 44 C 55 44, 44 54, 44 68 C 44 82, 54 90, 80 98 L 96 104 C 128 116, 145 132, 145 162 C 145 198, 116 216, 75 216 C 32 216, 6 195, 5 156 L 35 156 C 36 176, 50 188, 75 188 C 98 188, 113 177, 113 162 C 113 145, 102 137, 78 128 L 62 122 C 28 108, 12 94, 12 68 C 12 34, 38 16, 75 16 C 112 16, 134 35, 135 68 Z" />

      <!-- A -->
      <path d="M 228 16 L 278 214 L 244 214 L 233 166 L 195 166 L 184 214 L 152 214 L 202 16 Z M 214 74 L 202 138 L 226 138 Z" />

      <!-- L -->
      <path d="M 315 16 L 347 16 L 347 186 L 415 186 L 415 214 L 315 214 Z" />
    </g>

    <!-- VIBRANT ORANGE LAYER (E, A, D and Slash) -->
    <g fill="#EB4A00">
      <!-- Dynamic Slash Blade Accent between L and E -->
      <path d="M 398 220 L 442 10 L 434 10 L 390 220 Z" />

      <!-- E -->
      <path d="M 445 16 L 535 16 L 535 44 L 477 44 L 477 101 L 525 101 L 525 129 L 477 129 L 477 186 L 535 186 L 535 214 L 445 214 Z" />

      <!-- A (Second) -->
      <path d="M 628 16 L 678 214 L 644 214 L 633 166 L 595 166 L 584 214 L 552 214 L 602 16 Z M 614 74 L 602 138 L 626 138 Z" />

      <!-- D -->
      <path d="M 715 16 L 795 16 C 840 16, 875 48, 875 115 C 875 182, 840 214, 795 214 L 715 214 Z M 747 44 L 747 186 L 792 186 C 822 186, 842 164, 842 115 C 842 66, 822 44, 792 44 Z" />
    </g>
  </g>
</svg>
